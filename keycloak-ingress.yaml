apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.chronos-live.de
      secretName: keycloak-tls
  rules:
    - host: auth.chronos-live.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 9000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 9000