apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: bitwardensecret
    app.kubernetes.io/instance: bitwardensecret-keycloak
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: sm-operator
  name: keycloak-secret
  namespace: keycloak
spec:
  organizationId: 3e4b7901-bc75-4688-9a82-b3f600a40fa8
  secretName: keycloak-secret
  onlyMappedSecrets: true # default is true
  map:
    - bwSecretId: 5016b3f2-d79c-44c3-95e7-b3fd0110efd9
      secretKeyName: database_password
  authToken:
    secretName: bw-auth-token
    secretKey: token
