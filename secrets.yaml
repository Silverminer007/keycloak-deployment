apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: bitwardensecret
    app.kubernetes.io/instance: bitwardensecret-keycloak
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: sm-operator
  name: keycloak-secret
  namespace: keycloak
spec:
  organizationId: 3e4b7901-bc75-4688-9a82-b3f600a40fa8
  secretName: keycloak-secret
  onlyMappedSecrets: true # default is true
  map:
    - bwSecretId: 5016b3f2-d79c-44c3-95e7-b3fd0110efd9
      secretKeyName: database_password
    - bwSecretId: f3da84d7-5a2f-42f5-8af4-b403012e715d
      secretKeyName: backup_bucket
    - bwSecretId: 9e5a1327-c33b-4cc7-99ac-b403012edc34
      secretKeyName: backup_access_key_id
    - bwSecretId: aa67843f-9d59-4c6c-be68-b403012eed93
      secretKeyName: backup_secret_access_key
    - bwSecretId: 2c72168b-ebaf-4af4-a8d2-b403012f15a1
      secretKeyName: backup_region
    - bwSecretId: e66b944a-d56d-495a-acc9-b403012ea6fc
      secretKeyName: backup_endpoint_url
  authToken:
    secretName: bw-auth-token
    secretKey: token
