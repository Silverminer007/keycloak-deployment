apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 3
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      imagePullSecrets:
        - name: chronos-docker-secret
      containers:
        - name: keycloak
          image: ghcr.io/silverminer007/keycloak:latest
          command: ['/opt/keycloak/bin/kc.sh', 'start', '--optimized', '--http-enabled=true']
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: metrics
          env:
            - name: KC_DB_URL
              value: "jdbc:postgresql://keycloak-postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: database_password
            - name: KC_HOSTNAME
              value: "https://auth.chronos-live.de"
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            #- name: KC_PROXY_TRUSTED_ADDRESSES
            #  value: 10.42.0.0/16